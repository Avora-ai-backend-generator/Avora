name: Node SDK
on:
  push:
    paths: ['avora-sdk/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['avora-sdk/**', '.github/workflows/sdk.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avora-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: avora-sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
